<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Unofficial Cyberpunk 2077 completionist companion: cyberware, perks, capacity, builds and more.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chromedeck">
<title>Chromedeck</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <div class="brand"><h1>Chrome<span>deck</span></h1><span class="ver">2.31 · PL</span></div>
  <div class="buildbar" id="buildbar">
    <label class="lbl" for="buildSel">Build</label>
    <select id="buildSel"></select>
    <button class="btn sm" id="hdrSave" title="Everything autosaves; this just confirms it">Save</button>
  </div>
  <div class="gauge" id="gauge"></div>
</header>
<nav class="subnav" id="subnav" aria-label="Character sections"></nav>

<main>
  <section class="view" id="v-cyberware" aria-label="Cyberware loadout"></section>
  <section class="view" id="v-perks" aria-label="Attributes and perks"></section>
  <section class="view" id="v-capacity" aria-label="Capacity sources and shards"></section>
  <section class="view" id="v-builds" aria-label="Saved builds"></section>
  <section class="view" id="v-journal" aria-label="Journal"></section>
  <section class="view" id="v-collection" aria-label="Collection"></section>
  <section class="view" id="v-wardrobe" aria-label="Wardrobe"></section>
  <section class="view" id="v-system" aria-label="System"></section>
  <noscript><p class="hint">Chromedeck needs JavaScript.</p></noscript>
</main>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sh"><h3 id="sheetTitle"></h3><button class="x" id="sheetClose" aria-label="Close">✕</button></div>
  <div class="sb" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="update" id="update" hidden><span>A new version is ready.</span><button class="btn sm pri" id="swReload">Update</button></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
