<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chromedeck — Cyberpunk 2077 planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04070a; --panel:#0a1116; --panel2:#0f181f; --line:#1c3139; --line2:#2b4a55;
  --cyan:#5be7f2; --cyan-dim:#2a7f89; --yellow:#f5e60d; --red:#ff3d5e; --green:#7ee08a;
  --text:#d9e5e7; --muted:#7f959b; --faint:#56696f;
  --r-common:#c9d3d6; --r-uncommon:#79d65f; --r-rare:#55a9ff; --r-epic:#c77dff; --r-legendary:#ff9d3b; --r-iconic:#ffd45e;
  --chamfer:10px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:500;font-size:17px;line-height:1.3}
body{min-height:100vh;background-image:
  linear-gradient(rgba(91,231,242,.035) 1px, transparent 1px),
  linear-gradient(90deg, rgba(91,231,242,.035) 1px, transparent 1px);
  background-size:28px 28px;padding-bottom:calc(84px + var(--safe-b))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
::selection{background:var(--cyan);color:#000}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(4,7,10,.98),rgba(4,7,10,.92));backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
header>*{max-width:696px;margin-left:auto;margin-right:auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.brand h1 span{color:var(--cyan)}
.brand .ver{font-size:12px;color:var(--muted);letter-spacing:.08em}
.buildbar{display:flex;align-items:center;gap:8px;margin-top:6px}
.buildbar .lbl{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.buildbar select{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line2);color:var(--text);padding:6px 8px;font-weight:600;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}

/* capacity gauge (hero) */
.gauge{margin-top:10px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline}
.gauge .title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.gauge .val{font-size:22px;font-weight:700}
.gauge .val small{font-size:13px;color:var(--muted);font-weight:600}
.gauge .val.warn{color:var(--red)}
.segs{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;margin-top:4px;height:14px}
.segs i{display:block;background:#142129;border-bottom:2px solid #1a2c35}
.segs i.on{background:var(--yellow);border-bottom-color:#a89c00}
.segs i.over{background:var(--red);border-bottom-color:#8a1a2c}
.segs i.dead{background:repeating-linear-gradient(135deg,#0c1318 0 2px,#3a1620 2px 4px);border-bottom-color:transparent}
.gauge .sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.gauge .sub b{color:var(--text);font-weight:600}
.gauge .sub .bad{color:var(--red)}

/* ---------- tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,minmax(0,140px));justify-content:center;background:rgba(4,7,10,.97);border-top:1px solid var(--line);padding:6px 8px calc(8px + var(--safe-b))}
nav.tabs button{padding:8px 2px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:2px solid transparent}
nav.tabs button.on{color:var(--yellow);border-top-color:var(--yellow)}
nav.tabs button .ico{display:block;font-size:16px;margin-bottom:2px;color:var(--cyan)}
nav.tabs button.on .ico{color:var(--yellow)}

main{padding:12px 12px 0;max-width:720px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);margin-bottom:12px;position:relative;clip-path:polygon(0 0,calc(100% - var(--chamfer)) 0,100% var(--chamfer),100% 100%,var(--chamfer) 100%,0 calc(100% - var(--chamfer)))}
.panel::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:var(--cyan-dim)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 6px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:700}
.ph .meta{font-size:12px;color:var(--muted);letter-spacing:.06em}
.ph .meta b{color:var(--text)}
.pb{padding:8px 12px 10px 14px}
.hint{font-size:13px;color:var(--muted);line-height:1.35}
.hint a{color:var(--cyan)}

/* slot rows */
.slot{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px 9px 12px;border:1px solid var(--line);background:var(--panel2);margin:6px 0;position:relative;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.slot.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(91,231,242,.05) 6px 7px);border-style:dashed;color:var(--muted)}
.slot .nm{flex:1;min-width:0;font-weight:600;font-size:17px;line-height:1.15}
.slot .nm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:500;color:var(--muted);line-height:1.25;margin-top:2px}
.slot .cap{font-size:18px;font-weight:700;min-width:44px;text-align:right}
.slot .cap s{color:var(--faint);font-size:12px;font-weight:500;margin-right:4px}
.slot .cap small{font-size:11px;color:var(--muted);font-weight:600;display:block;line-height:1;letter-spacing:.08em}
.slot .add{color:var(--cyan);font-size:20px;line-height:1;width:22px;text-align:center}

/* tier / rarity badge — text + shape, never color alone */
.tb{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border:1px solid currentColor;line-height:1;min-width:34px;justify-content:center;flex-shrink:0}
.tb.t1{color:var(--r-common)}.tb.t2{color:var(--r-uncommon)}.tb.t3{color:var(--r-rare)}.tb.t4{color:var(--r-epic)}.tb.t5{color:var(--r-legendary)}
.tb.ic{color:var(--r-iconic);background:rgba(255,212,94,.08)}
.tb.ic::before{content:"◆";font-size:10px}

/* ---------- sheet (picker / detail) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-top:2px solid var(--cyan);max-height:88vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sh{display:flex;align-items:center;gap:10px;padding:10px 12px 8px 14px;border-bottom:1px solid var(--line);position:relative}
.sh::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--yellow)}
.sh h3{margin:0;flex:1;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.sh .x{color:var(--cyan);font-size:22px;line-height:1;padding:2px 6px}
.sb{overflow:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.search{display:flex;gap:8px;margin-bottom:8px}
.search input{flex:1;background:var(--panel);border:1px solid var(--line2);padding:8px 10px;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:4px 9px;border:1px solid var(--line2);color:var(--muted);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.chip.on{background:var(--cyan);color:#021014;border-color:var(--cyan)}
.item{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.item .main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 6px 9px 10px}
.item .info{color:var(--cyan);font-size:17px;padding:0 10px;border-left:1px solid var(--line)}
.item .nm{flex:1;min-width:0;font-weight:600}
.item .nm small{display:block;font-size:12px;color:var(--muted);font-weight:500;line-height:1.25;white-space:normal}
.item .cap{font-size:18px;font-weight:700;min-width:36px;text-align:right}
.item.used{opacity:.45}
.item.sel{background:rgba(245,230,13,.07)}
.item .st{font-size:11px;color:var(--yellow);letter-spacing:.08em;text-transform:uppercase;font-weight:700}

.detail .name{font-size:22px;font-weight:700;margin:2px 0 4px}
.detail .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--muted)}
.detail .line b{color:var(--text)}
.detail .eff{white-space:pre-wrap;border-left:2px solid var(--line2);padding:6px 10px;margin:6px 0 10px;line-height:1.35}
.detail .req{color:var(--yellow);font-size:13px;margin-bottom:6px}
.detail .notes{color:var(--muted);font-size:13px;margin-bottom:8px;white-space:pre-wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{padding:9px 14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;border:1px solid var(--cyan);color:var(--cyan);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.btn.pri{background:var(--yellow);color:#111;border-color:var(--yellow)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}

/* form bits */
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field .k{flex:1;min-width:0}
.field .k small{display:block;color:var(--muted);font-size:12px;line-height:1.25;margin-top:1px}
.field .v{display:flex;align-items:center;gap:6px}
.field .v .n{min-width:36px;text-align:center;font-size:18px;font-weight:700}
.step{width:34px;height:32px;border:1px solid var(--line2);color:var(--cyan);font-size:18px;font-weight:700;line-height:1;display:grid;place-items:center}
.step:disabled{opacity:.3}
.tog{width:52px;height:28px;border:1px solid var(--line2);position:relative;background:var(--panel2);clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--faint);transition:left .15s,background .15s}
.tog.on{border-color:var(--yellow)}
.tog.on::after{left:27px;background:var(--yellow)}
.pill{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--faint);color:var(--faint)}
.pill.on{border-color:var(--yellow);color:var(--yellow)}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{padding:5px 10px;font-size:13px;font-weight:700;color:var(--muted);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--cyan);color:#021014}
input[type=range]{width:150px;accent-color:var(--yellow)}
input[type=number],input[type=text],textarea{background:var(--panel2);border:1px solid var(--line2);padding:6px 8px;color:var(--text);width:100%}
input[type=number]{width:72px;text-align:right}
textarea{min-height:90px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.4}
textarea.notes{font-family:inherit;font-size:15px}

/* capacity summary table */
.sum{width:100%;border-collapse:collapse;font-size:15px}
.sum td{padding:5px 0;border-bottom:1px solid var(--line)}
.sum td:last-child{text-align:right;font-weight:700;font-size:17px}
.sum tr.total td{border-bottom:0;border-top:2px solid var(--line2);color:var(--yellow);font-size:18px;padding-top:8px}
.sum tr.dim td{color:var(--muted)}
.sum tr.bad td{color:var(--red)}

/* shard cards */
.shard{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.shard:last-child{border-bottom:0}
.shard .k{flex:1;min-width:0}
.shard .k b{display:block;font-size:16px}
.shard .k small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.shard .pips{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.shard .pips i{width:12px;height:8px;background:#142129;border:1px solid var(--line2)}
.shard .pips i.on{background:var(--cyan);border-color:var(--cyan)}
.shard .pips i.pl{border-color:#c77dff}
.shard .pips i.pl.on{background:#c77dff}
.shard .v{display:flex;align-items:center;gap:6px}
.shard .v .n{min-width:44px;text-align:center;font-size:16px;font-weight:700}

/* build list */
.bl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 10px 10px 12px;border:1px solid var(--line);background:var(--panel2);margin:6px 0;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.bl.on{border-color:var(--yellow)}
.bl .nm{flex:1;font-weight:700;font-size:17px}
.bl .nm small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.bl .cap{font-weight:700;font-size:17px}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--yellow);color:#111;font-weight:700;letter-spacing:.06em;padding:8px 14px;z-index:40;opacity:0;transition:.2s;pointer-events:none;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}
.toast.on{opacity:1;transform:translateX(-50%)}
.warnbox{border:1px solid var(--red);color:var(--red);padding:8px 10px;font-size:13px;margin:8px 0;background:rgba(255,61,94,.06)}
.okbox{border:1px solid var(--cyan-dim);color:var(--cyan);padding:8px 10px;font-size:13px;margin:8px 0}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line2);padding:1px 4px}
/* perks */
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.pts div{border:1px solid var(--line);padding:6px 8px;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%)}
.pts small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pts b{font-size:22px;font-weight:700;color:var(--yellow)}
.pts b span{font-size:13px;color:var(--muted);font-weight:600}
.achips{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 0 12px}
.achip{display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;border:1px solid var(--line2);color:var(--muted);clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
.achip b{font-size:11px;letter-spacing:.06em}
.achip span{font-size:18px;font-weight:700;color:var(--text);line-height:1.1}
.achip.on{background:var(--cyan);color:#021014;border-color:var(--cyan)}
.achip.on span{color:#021014}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:4px 0 8px}
.tiers span{text-align:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-top:2px solid var(--line)}
.tiers span b{display:block;font-size:15px;color:inherit}
.tiers span.on{color:var(--cyan);border-top-color:var(--cyan)}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.seg.wide button{padding:6px 4px;font-size:12px;letter-spacing:.02em;white-space:normal;line-height:1.15}
.tree{background:var(--panel);border:1px solid var(--line);margin-bottom:10px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.tree .node{cursor:pointer}
.tree .node:focus-visible{outline:none}
.tree .node:focus-visible path:nth-child(2){stroke:var(--yellow);stroke-width:3}
.lvls{margin:8px 0 10px}
.lvl{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.lvl:last-child{border-bottom:0}
.lvl.on{color:var(--text)}
.lvl.on span:first-child{color:var(--yellow)}
.lvl span:first-child{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
@media (min-width:720px){.segs{height:16px}}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>Chrome<span>deck</span></h1><span class="ver">2.31 · phase 2</span></div>
  <div class="buildbar">
    <span class="lbl">Build</span>
    <select id="buildSel" aria-label="Active build"></select>
    <button class="btn sm" id="hdrSave" title="Save now">Save</button>
  </div>
  <div class="gauge" id="gauge"></div>
</header>

<main>
  <!-- LOADOUT -->
  <section class="view on" id="v-loadout" aria-label="Cyberware loadout"></section>

  <!-- PERKS -->
  <section class="view" id="v-perks" aria-label="Attributes and perks"></section>

  <!-- CAPACITY -->
  <section class="view" id="v-capacity" aria-label="Capacity sources and shards"></section>

  <!-- BUILDS -->
  <section class="view" id="v-builds" aria-label="Saved builds"></section>

  <!-- DATA -->
  <section class="view" id="v-data" aria-label="Data editor"></section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="loadout" class="on"><span class="ico">⬡</span>Chrome</button>
  <button data-tab="perks"><span class="ico">⬢</span>Perks</button>
  <button data-tab="capacity"><span class="ico">▤</span>Capacity</button>
  <button data-tab="builds"><span class="ico">▣</span>Builds</button>
  <button data-tab="data"><span class="ico">⌗</span>Data</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="sh"><h3 id="sheetTitle"></h3><button class="x" id="sheetClose" aria-label="Close">✕</button></div>
  <div class="sb" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   SEED DATA — Cyberpunk 2077 patch 2.31
   Capacity costs are fixed per item (tier upgrades change stats, not cost).
   "tier" = the quality the item first appears at. Effects are paraphrased
   ranges from lowest to highest tier. Edit in the Data tab if a patch
   rebalances something; your edits override this seed and survive reloads.
   ===================================================================== */
const SEED = {
  version: "2.31 seed 2026-09-04 · perks",
  slots: [
    {id:"frontal",  name:"Frontal Cortex",       base:3},
    {id:"os",       name:"Operating System",     base:1},
    {id:"arms",     name:"Arms",                 base:1},
    {id:"face",     name:"Face",                 base:1, faceplate:true},
    {id:"skeleton", name:"Skeleton",             base:2, perkSlot:"licenseToChrome", perkName:"License to Chrome"},
    {id:"hands",    name:"Hands",                base:1, perkSlot:"ambidextrous",   perkName:"Ambidextrous"},
    {id:"nervous",  name:"Nervous System",       base:3},
    {id:"circ",     name:"Circulatory System",   base:3},
    {id:"integ",    name:"Integumentary System", base:3},
    {id:"legs",     name:"Legs",                 base:1}
  ],
  capacity: {
    base:21, perLevel:3, minLevel:1, maxLevel:60, hardCap:450,
    engineering:[{skill:10,bonus:5},{skill:30,bonus:10}],
    renaissancePerAttr:4, edgerunner:50, allThingsCyberPct:20,
    allThingsCyberSlots:["skeleton","integ"], chromeCompressorId:"chrome_compressor",
    perkLinks:{renaissance:"renaissance_punk", allThingsCyber:"all_things_cyber", licenseToChrome:"license_to_chrome", licenseSlotLevel:3, ambidextrous:"ambidextrous", edgerunner:"edgerunner"}
  },

/* ============================ perks: rules ============================ */
const UI = { perkAttr:"body", perkBranch:0 };
function perk(id){ return DATA.perks.find(p=>p.id===id); }
function attrMeta(id){ return DATA.attributes.find(a=>a.id===id); }
function attrVal(b,a){ const P=DATA.progression; return Math.max(P.attrBase, Math.min(P.attrMax, (b.attrs&&b.attrs[a])||P.attrBase)); }
function perkLevel(b,id){ return (b.perks && b.perks[id])|0; }
function perkCost(p){ return p.cost||1; }
function perkGate(b,p){
  if(p.attr!=="relic" && attrVal(b,p.attr) < p.tier) return {ok:false, why:`Needs ${attrMeta(p.attr).name} ${p.tier}`};
  if(p.req && perkLevel(b,p.req)<1) return {ok:false, why:`Needs ${perk(p.req).name}`};
  return {ok:true};
}
function budgets(b){
  const P=DATA.progression, C=DATA.capacity;
  const lvl = Math.max(C.minLevel, Math.min(C.maxLevel, b.level|0));
  const attrTotal = P.attrBase*5 + P.attrFree + (lvl-1);
  const attrSpent = DATA.attributes.filter(a=>!a.relic).reduce((s,a)=>s+attrVal(b,a.id),0);
  const perkTotal = (lvl-1) + ((b.bonusPerk===undefined?P.perkBonus:b.bonusPerk)|0);
  let perkSpent=0, relicSpent=0; const byAttr={};
  DATA.perks.forEach(p=>{ const l=perkLevel(b,p.id); if(!l) return; const c=l*perkCost(p); byAttr[p.attr]=(byAttr[p.attr]||0)+c; if(p.attr==="relic") relicSpent+=c; else perkSpent+=c; });
  return {lvl, attrTotal, attrSpent, attrFree:attrTotal-attrSpent, perkTotal, perkSpent, perkFree:perkTotal-perkSpent, relicTotal:P.relicPoints, relicSpent, relicFree:P.relicPoints-relicSpent, byAttr};
}
/* derived from the tree — the capacity math reads these instead of manual toggles */
function derived(b){
  const C=DATA.capacity; const ids=C.perkLinks||{};
  const attrs9 = DATA.attributes.filter(a=>!a.relic && attrVal(b,a.id)>=9).length;
  return {
    renPunk: perkLevel(b, ids.renaissance||"renaissance_punk")>=1,
    renAttrs: attrs9,
    atc: perkLevel(b, ids.allThingsCyber||"all_things_cyber"),

function dependents(id){ // every perk that (transitively) requires id

}
function addPerkPoint(b,id){

}
function removePerkPoint(b,id){

/* if a perk-granted cyberware slot disappears, drop what was in it */

/* ============================ perks: layout ============================ */
const TREE_W = 360, NODE_CORE = 25, NODE_SAT = 19, ROW_H = 86, BAND_PAD = 8, LABEL_H = 26, MAX_PER_ROW = 3;
function layoutBranch(attr, br, b){
  const P = DATA.perks.filter(p=>p.attr===attr && p.br===br);
  const tiers = attr==="relic" ? [...new Set(P.map(p=>p.tier))].sort((x,y)=>x-y) : DATA.progression.tiers;
  const nodes=[], bands=[]; let y=0;
  tiers.forEach(tier=>{
    const inTier = P.filter(p=>p.tier===tier); if(!inTier.length) return;
    const roots = inTier.filter(p=>!p.req || !inTier.find(q=>q.id===p.req));
    const clusters = roots.map(r=>{
      const rows=[[r]]; let frontier=[r];
      for(;;){ const next=inTier.filter(p=>frontier.some(f=>f.id===p.req)); if(!next.length) break; rows.push(next); frontier=next; }
      const wrapped=[]; rows.forEach(row=>{ const chunks=Math.ceil(row.length/MAX_PER_ROW), size=Math.ceil(row.length/chunks); for(let i=0;i<row.length;i+=size) wrapped.push(row.slice(i,i+size)); });
      return {rows:wrapped, w:Math.max(...wrapped.map(r=>r.length))};
    });
    const totalW = clusters.reduce((a,c)=>a+c.w,0);
    const top=y; y+=LABEL_H+BAND_PAD; let x0=0, maxRows=0;
    clusters.forEach(c=>{
      const cwid = TREE_W*c.w/totalW;
      c.rows.forEach((row,ri)=>row.forEach((p,i)=>nodes.push({p, x:x0+(i+0.5)*cwid/row.length, y:y+ri*ROW_H+NODE_CORE+2, r:p.core?NODE_CORE:NODE_SAT, row:ri, cx0:x0, cx1:x0+cwid})));
      maxRows=Math.max(maxRows,c.rows.length); x0+=cwid;
    });
    y += maxRows*ROW_H + BAND_PAD; bands.push({tier, top, bottom:y});
  });
  // edges (including links back to a core in an earlier band, same branch)
  const edges=[]; nodes.forEach(n=>{ if(!n.p.req) return; const par=nodes.find(m=>m.p.id===n.p.req); if(par) edges.push({from:par,to:n}); });
  return {nodes, edges, bands, h:y};
}
function hexPath(x,y,r){ const pts=[]; for(let k=0;k<6;k++){ const a=Math.PI/6+k*Math.PI/3; pts.push((x+r*Math.cos(a)).toFixed(1)+","+(y+r*Math.sin(a)).toFixed(1)); } return "M"+pts.join("L")+"Z"; }
function wrapLabel(s, max){ const words=s.split(" "); const lines=[]; let cur=""; words.forEach(w=>{ if((cur+" "+w).trim().length>max && cur){ lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }); if(cur) lines.push(cur); if(lines.length>3){ lines[2]=lines.slice(2).join(" "); lines.length=3; if(lines[2].length>max+2) lines[2]=lines[2].slice(0,max)+"…"; } return lines; }

function renderTree(attr, br, b){
  const L=layoutBranch(attr, br, b); const P=DATA.progression; const av=attr==="relic"?99:attrVal(b,attr);
  let s=`<svg viewBox="0 0 ${TREE_W} ${L.h}" width="100%" style="display:block" font-family="inherit">`;
  L.bands.forEach((bd,i)=>{
    const locked = bd.tier>av && attr!=="relic";
    s+=`<rect x="0" y="${bd.top}" width="${TREE_W}" height="${bd.bottom-bd.top}" fill="${i%2?"rgba(91,231,242,.025)":"transparent"}"/>`;
    s+=`<line x1="0" y1="${bd.top+.5}" x2="${TREE_W}" y2="${bd.top+.5}" stroke="var(--line)"/>`;
    const lbl = attr==="relic" ? (["","Emergency Cloaking","Vulnerability Analytics","Jailbreak"][bd.tier]||"") : `${P.tierNames[bd.tier]} · ${attr==="relic"?"":attrMeta(attr).short+" "}${bd.tier}`;
    s+=`<text x="8" y="${bd.top+17}" font-size="11" font-weight="700" letter-spacing="1.2" fill="${locked?"var(--faint)":"var(--cyan)"}">${esc(lbl.toUpperCase())}${locked?"  ·  LOCKED":""}</text>`;
    if(locked) s+=`<rect x="0" y="${bd.top}" width="${TREE_W}" height="${bd.bottom-bd.top}" fill="url(#hatch)" opacity=".5"/>`;
  });
  L.edges.forEach(e=>{
    const pl=perkLevel(b,e.from.p.id), cl=perkLevel(b,e.to.p.id);
    const col = cl?"var(--yellow)":pl?"var(--cyan)":"var(--line2)";
    const y1=e.from.y+e.from.r, y2=e.to.y-e.to.r, ym=Math.min(e.from.y+e.from.r+LABEL_H+4, y2-6);
    const sameBand = e.from.cx0===e.to.cx0 && e.to.row-e.from.row>1;
    let d;
    if(sameBand){ // wrapped row: run a bus down the cluster's outer edge so it can't be read as a link through the row above
      const bx = e.to.x < (e.to.cx0+e.to.cx1)/2 ? e.to.cx0+6 : e.to.cx1-6;
      d=`M${e.from.x},${y1} V${ym} H${bx} V${y2-8} H${e.to.x} V${y2}`;
    } else d=`M${e.from.x},${y1} V${ym} H${e.to.x} V${y2}`;
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${cl?2:1.5}" ${cl||pl?"":'stroke-dasharray="3 3"'}/>`;
  });
  L.nodes.forEach(n=>{
    const p=n.p, l=perkLevel(b,p.id), g=perkGate(b,p), maxed=l>=p.max;
    const fill = l ? (maxed?"var(--yellow)":"rgba(245,230,13,.18)") : g.ok ? "var(--panel2)" : "var(--panel)";
    const stroke = l ? "var(--yellow)" : g.ok ? "var(--cyan)" : "var(--faint)";
    const txt = l ? (maxed?"#111":"var(--yellow)") : g.ok ? "var(--text)" : "var(--faint)";
    s+=`<g class="node" data-perk="${p.id}" role="button" tabindex="0" aria-label="${esc(p.name)}, ${l}/${p.max}">`;
    s+=`<path d="${hexPath(n.x,n.y,n.r+3)}" fill="none" stroke="${stroke}" stroke-opacity=".35" stroke-width="1"/>`;
    s+=`<path d="${hexPath(n.x,n.y,n.r)}" fill="${fill}" stroke="${stroke}" stroke-width="${p.core?2.2:1.6}" ${g.ok||l?"":'stroke-dasharray="4 3"'}/>`;
    if(p.max>1) s+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="${p.core?14:12}" font-weight="700" fill="${txt}">${l}/${p.max}</text>`;
    else if(p.cost) s+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="12" font-weight="700" fill="${txt}">${l?"✓":p.cost}</text>`;
    else s+=`<text x="${n.x}" y="${n.y+5}" text-anchor="middle" font-size="13" font-weight="700" fill="${txt}">${l?"✓":""}</text>`;
    const lines=wrapLabel(p.name, p.core?17:15);
    lines.forEach((ln,i)=>{ s+=`<text x="${n.x}" y="${n.y+n.r+12+i*11}" text-anchor="middle" font-size="10.5" font-weight="${l?700:600}" paint-order="stroke" stroke="var(--panel)" stroke-width="3" stroke-linejoin="round" fill="${l?"var(--yellow)":g.ok?"var(--text)":"var(--faint)"}">${esc(ln)}</text>`; });
    s+=`</g>`;
  });
  s+=`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1a2a32" stroke-width="2"/></pattern></defs></svg>`;

}

const KEY = "chromedeck.v1";
const mem = {};
const store = {
  get(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return mem.state || null; } },
  set(v){ mem.state = v; try{ localStorage.setItem(KEY, JSON.stringify(v)); return true; }catch(e){ return false; } },
  persistent(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }catch(e){ return false; } }
};

let DATA = null;       // active data (seed or user override)
let S = null;          // app state
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));

function newBuild(name){
  const b = {
    id:uid(), name:name||"New build", notes:"",
    level:60, engineering:30, shardMode:"max", ccBonus:70, bonusPerk:DATA.progression.perkBonus,
    attrs:Object.fromEntries(DATA.attributes.filter(a=>!a.relic).map(a=>[a.id, DATA.progression.attrBase])),
    perks:{}, equipped:{}, created:Date.now(), updated:Date.now()
  };
  DATA.slots.forEach(s=>{ b.equipped[s.id]=Array(slotCount(s,b)).fill(null); });
  return b;
}
function loadState(){
  const saved = store.get();
  if(saved && saved.dataOverride){ DATA = saved.dataOverride; } else { DATA = clone(SEED); }
  if(saved && saved.builds && saved.builds.length){
    S = saved;
  } else {
    S = { builds:[], active:null, playthrough:{shards:{}}, dataOverride: saved ? saved.dataOverride : null };
    EXAMPLE_BUILDS.forEach(ex=>{ const b = Object.assign(newBuild(), clone(ex), {id:uid()}); S.builds.push(b); });
    S.active = S.builds[0].id;
  }
  normalize();
}
/* Phase-1 builds stored capacity perks as toggles; turn those into real perks once. */
function migrateFlags(b){
  if(!("renPunk" in b) && !("atc" in b) && !("licenseToChrome" in b) && !("ambidextrous" in b) && !("edgerunner" in b)) return;
  b.perks=b.perks||{}; b.attrs=b.attrs||{}; const L=DATA.capacity.perkLinks; const bump=(a,v)=>{ if((b.attrs[a]||3)<v) b.attrs[a]=v; };
  if(b.atc>=2 || b.renPunk){ b.perks[L.allThingsCyber]=Math.max(b.perks[L.allThingsCyber]|0, 2); bump("tech",9); }
  if(b.renPunk){ b.perks[L.renaissance]=1; }
  if(b.licenseToChrome || b.ambidextrous || b.edgerunner){ b.perks[L.licenseToChrome]=Math.max(b.perks[L.licenseToChrome]|0, b.licenseToChrome?L.licenseSlotLevel:1); b.perks[L.allThingsCyber]=Math.max(b.perks[L.allThingsCyber]|0,1); bump("tech",15); }
  if(b.ambidextrous) b.perks[L.ambidextrous]=1;
  if(b.edgerunner){ b.perks[L.edgerunner]=1; bump("tech",20); }
  let need=(b.renAttrs|0) - DATA.attributes.filter(a=>!a.relic && (b.attrs[a.id]||3)>=9).length;
  ["body","reflexes","cool","int"].forEach(a=>{ if(need>0 && (b.attrs[a]||3)<9){ b.attrs[a]=9; need--; } });
  ["renPunk","renAttrs","atc","licenseToChrome","ambidextrous","edgerunner"].forEach(k=>delete b[k]);
}
/* Fill in missing fields and fit equipped arrays to the slot counts — after load, import, or data edits. */
function normalize(){
  if(!S.playthrough) S.playthrough = {shards:{}};
  if(!S.playthrough.shards) S.playthrough.shards = {};
  const d = newBuild();
  S.builds.forEach(b=>{
    for(const k in d){ if(b[k]===undefined && k!=="id") b[k]=clone(d[k]); }
    migrateFlags(b);
    b.equipped = b.equipped||{};
    DATA.slots.forEach(sl=>{ const n=slotCount(sl,b); const arr=(b.equipped[sl.id]||[]).slice(0,n); while(arr.length<n) arr.push(null); b.equipped[sl.id]=arr.map(id=> id && cw(id) ? id : null); });
  });
  if(!S.builds.find(b=>b.id===S.active)) S.active = S.builds[0].id;
}
function save(silent){ const ok = store.set(S); if(!silent) toast(ok ? "Saved" : "Saved for this session only — this browser blocks storage"); }
function build(){ return S.builds.find(b=>b.id===S.active) || S.builds[0]; }

/* ============================ rules ============================ */
function slotCount(sl, b){
  let n = sl.base;
  if(sl.faceplate) n += 1;
  if(sl.perkSlot && b && derived(b)[sl.perkSlot]) n += 1;
  return n;
}
function cw(id){ return DATA.cyberware.find(c=>c.id===id); }
function itemCost(item, b){
  if(!item) return 0;
  const C = DATA.capacity;
  if(derived(b).atc>=2 && C.allThingsCyberSlots.includes(item.slot)) return Math.round(item.cap*(1-C.allThingsCyberPct/100));
  return item.cap;
}
function shardTotals(b){
  let max=0, tracked=0;
  DATA.shards.forEach(sh=>{ max += sh.each*sh.max; const n = Math.min(S.playthrough.shards[sh.id]||0, sh.max); tracked += sh.each*n; });
  return {max, tracked, used: b.shardMode==="max" ? max : tracked};
}
function calc(b){
  const C = DATA.capacity;
  const lvl = Math.max(C.minLevel, Math.min(C.maxLevel, b.level|0));
  const base = C.base + C.perLevel*lvl;
  const eng = C.engineering.reduce((a,e)=> a + ((b.engineering|0)>=e.skill ? e.bonus : 0), 0);
  const D = derived(b);
  const ren = D.renPunk ? C.renaissancePerAttr*D.renAttrs : 0;
  const sh = shardTotals(b);
  const osIds = (b.equipped.os||[]);
  const cc = osIds.includes(C.chromeCompressorId) ? (b.ccBonus|0) : 0;
  const normal = Math.min(C.hardCap, base + eng + ren + sh.used + cc);
  const over = D.edgerunner ? C.edgerunner : 0;
  const limit = Math.min(C.hardCap, normal + over);
  let used = 0; const rows=[];
  DATA.slots.forEach(sl=>{ (b.equipped[sl.id]||[]).forEach(id=>{ const it=cw(id); if(it){ const c=itemCost(it,b); used+=c; rows.push({it,c}); } }); });
  const overBy = Math.max(0, used-normal);
  return {lvl, base, eng, ren, shards:sh, cc, normal, over, limit, used, overBy, invalid: used>limit, free: limit-used, healthPenalty: overBy*0.5};
}

function renderHeader(){

  const sel = $("#buildSel");
  sel.innerHTML = S.builds.map(x=>`<option value="${x.id}"${x.id===b.id?" selected":""}>${esc(x.name)}</option>`).join("");
  const N=40; const perSeg = r.limit/N;
  let segs="";
  for(let i=0;i<N;i++){
    const lo=i*perSeg;
    let cls="";
    if(r.used>lo+perSeg*0.5) cls = (lo>=r.normal) ? "over" : "on";
    else if(lo>=r.normal) cls="dead";
    segs += `<i class="${cls}"></i>`;

let pick = null; // {slot, idx, q, chip}
function openPicker(slotId, idx){
  const sl = DATA.slots.find(s=>s.id===slotId); const b=build();

  pick = {slot:slotId, idx, q:"", chip:"all", faceplate:isFaceplate};

function renderPicker(){
  const b=build(); const sl=DATA.slots.find(s=>s.id===pick.slot);
  const installed = new Set(); Object.values(b.equipped).forEach(a=>a.forEach(id=>{ if(id) installed.add(id); }));
  const current = b.equipped[pick.slot][pick.idx];
  let items = DATA.cyberware.filter(c=>c.slot===pick.slot && (!!c.faceplate===!!pick.faceplate));
  const types = [...new Set(items.map(c=>c.type).filter(Boolean))];
  if(pick.chip==="iconic") items = items.filter(c=>c.iconic);
  else if(pick.chip!=="all") items = items.filter(c=>c.type===pick.chip);
  const q = pick.q.trim().toLowerCase();
  if(q) items = items.filter(c=>(c.name+" "+c.effect+" "+(c.notes||"")).toLowerCase().includes(q));
  items.sort((a,b2)=> (a.type||"").localeCompare(b2.type||"") || a.cap-b2.cap || a.name.localeCompare(b2.name));
  const chips = [["all","All"],...types.map(t=>[t,t]),["iconic","Iconic"]].map(([v,l])=>`<button class="chip ${pick.chip===v?"on":""}" data-chip="${v}">${l}</button>`).join("");
  const rows = items.map(c=>{
    const used = installed.has(c.id) && c.id!==current;
    const cost = itemCost(c,b);
    return `<div class="item ${used?"used":""} ${c.id===current?"sel":""}"><button class="main" data-install="${c.id}" ${used?'data-used="1"':""}>${tierBadge(c)}<span class="nm">${esc(c.name)}<small>${esc(firstLine(c.effect))}${c.req?` · needs ${esc(c.req)}`:""}</small>${c.id===current?'<span class="st">Installed here</span>':used?'<span class="st" style="color:var(--muted)">Installed elsewhere</span>':""}</span><span class="cap num">${cost}</span></button><button class="info" data-info="${c.id}" aria-label="Details for ${esc(c.name)}">ⓘ</button></div>`;
  }).join("") || `<p class="hint">Nothing matches.</p>`;
  $("#sheetBody").innerHTML = `
    <div class="search"><input id="pq" type="search" placeholder="Search name or effect" value="${esc(pick.q)}" aria-label="Search cyberware">${current?`<button class="btn sm warn" data-remove="1">Remove</button>`:""}</div>

/* ============================ actions ============================ */
function installAt(slotId, idx, id){
  const b=build();
  // remove from anywhere else first (unique per character)
  Object.keys(b.equipped).forEach(k=>{ b.equipped[k]=b.equipped[k].map(x=>x===id?null:x); });
  b.equipped[slotId][idx]=id; b.updated=Date.now(); save(true); closeSheet(); renderAll(); toast("Installed");
}
function download(name, obj){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}); const u=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),500);
}
function readFile(inp, cb){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ cb(JSON.parse(r.result)); }catch(e){ toast("That file isn't valid JSON"); } }; r.readAsText(f); inp.value=""; }
function validateData(d){
  if(!d||!Array.isArray(d.slots)||!Array.isArray(d.cyberware)||!d.capacity||!Array.isArray(d.shards)||!Array.isArray(d.perks)||!Array.isArray(d.attributes)||!d.progression) return "Needs slots, cyberware, shards, capacity, attributes, progression and perks.";
  const pids=new Set(d.perks.map(p=>p.id)); for(const p of d.perks){ if(!p.id||!p.attr||!p.name||!Array.isArray(p.lv)||!p.max) return `Perk "${p.name||p.id||"?"}" needs id, attr, name, max and lv[].`; if(p.req && !pids.has(p.req)) return `"${p.name}" requires unknown perk "${p.req}".`; if(!d.attributes.find(a=>a.id===p.attr)) return `"${p.name}" points at unknown attribute "${p.attr}".`; }
  const ids=new Set(); for(const c of d.cyberware){ if(!c.id||!c.slot||!c.name||typeof c.cap!=="number") return `Cyberware "${c.name||c.id||"?"}" needs id, slot, name and a numeric cap.`; if(ids.has(c.id)) return `Duplicate id "${c.id}".`; ids.add(c.id); if(!d.slots.find(s=>s.id===c.slot)) return `"${c.name}" points at unknown slot "${c.slot}".`; }
  return null;
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-tab],[data-pattr],[data-pbranch],[data-perk],[data-padd],[data-prem],[data-attr],#goTech,[data-pick],[data-detail],[data-install],[data-info],[data-chip],[data-remove],[data-swap],[data-uninstall],[data-edit],[data-savedit],[data-shard],[data-t],[data-d],[data-v],[data-open],#eIconic,#bNew,#bDup,#bDel,#bExport,#bExportAll,#bImport,#dExport,#dImport,#dReset,#dApply,#dReload,#sheetClose,#scrim,#hdrSave");
  if(!t) return;
  const b=build();
  if(t.dataset.tab){ showTab(t.dataset.tab); return; }
  if(t.id==="goTech"){ UI.perkAttr="tech"; UI.perkBranch=1; renderPerks(); showTab("perks"); return; }
  if(t.dataset.pattr){ UI.perkAttr=t.dataset.pattr; UI.perkBranch=0; renderPerks(); return; }
  if(t.dataset.pbranch!==undefined){ UI.perkBranch=+t.dataset.pbranch; renderPerks(); return; }
  if(t.dataset.perk){ openPerk(t.dataset.perk); return; }
  if(t.dataset.padd){ if(addPerkPoint(b,t.dataset.padd)){ save(true); openPerk(t.dataset.padd); renderAll(); } return; }
  if(t.dataset.prem){ if(removePerkPoint(b,t.dataset.prem)){ fixPerkSlots(b); save(true); openPerk(t.dataset.prem); renderAll(); } return; }
  if(t.dataset.attr){ setAttr(b, t.dataset.attr, attrVal(b,t.dataset.attr)+ +t.dataset.d); save(true); renderAll(); return; }
  if(t.id==="sheetClose"||t.id==="scrim"){ closeSheet(); return; }
  if(t.id==="hdrSave"){ save(); return; }
  if(t.dataset.info){ openDetail(t.dataset.info); return; }
  if(t.dataset.pick){ const [s,i]=t.dataset.pick.split(":"); openPicker(s,+i); return; }
  if(t.dataset.detail && !t.dataset.savedit){ openDetail(t.dataset.detail, t.dataset.from); return; }
  if(t.dataset.chip){ pick.chip=t.dataset.chip; renderPicker(); return; }
  if(t.dataset.install){ if(t.dataset.used){ toast("Already installed in another slot — tap ⓘ to see where it fits"); return; } if(pick) installAt(pick.slot,pick.idx,t.dataset.install); else { // from detail with no picker: put in first free slot of its type
      const it=cw(t.dataset.install); const arr=b.equipped[it.slot]; const n=slotCount(DATA.slots.find(s=>s.id===it.slot),b); let i=arr.findIndex((x,ix)=>!x && !(DATA.slots.find(s=>s.id===it.slot).faceplate && (ix===n-1)!==!!it.faceplate)); if(i<0) i = it.faceplate ? n-1 : 0; installAt(it.slot,i,t.dataset.install); }
    return; }
  if(t.dataset.remove){ b.equipped[pick.slot][pick.idx]=null; b.updated=Date.now(); save(true); closeSheet(); renderAll(); toast("Removed"); return; }
  if(t.dataset.uninstall){ const [s,i]=t.dataset.uninstall.split(":"); b.equipped[s][+i]=null; b.updated=Date.now(); save(true); closeSheet(); renderAll(); toast("Removed"); return; }
  if(t.dataset.swap){ const [s,i]=t.dataset.swap.split(":"); openPicker(s,+i); return; }
  if(t.dataset.edit){ openEdit(t.dataset.edit); return; }
  if(t.dataset.savedit){ commitEdit(t.dataset.savedit); return; }
  if(t.id==="eIconic"){ t.classList.toggle("on"); t.setAttribute("aria-pressed", t.classList.contains("on")); return; }
  if(t.dataset.shard){ const sh=DATA.shards.find(x=>x.id===t.dataset.shard); const cur=S.playthrough.shards[sh.id]||0; S.playthrough.shards[sh.id]=Math.max(0,Math.min(sh.max,cur+ +t.dataset.d)); save(true); renderHeader(); renderCapacity(); return; }
  if(t.dataset.v!==undefined){ const seg=t.closest(".seg"); const f=seg.dataset.f; b[f]= f==="shardMode" ? t.dataset.v : parseInt(t.dataset.v); b.updated=Date.now(); save(true); renderHeader(); renderCapacity(); return; }
  if(t.dataset.open){ S.active=t.dataset.open; save(true); renderAll(); return; }
  if(t.id==="bNew"){ const nb=newBuild("Build "+(S.builds.length+1)); S.builds.push(nb); S.active=nb.id; save(true); renderAll(); toast("New build"); return; }
  if(t.id==="bDup"){ const nb=clone(b); nb.id=uid(); nb.name=b.name+" copy"; nb.created=nb.updated=Date.now(); S.builds.push(nb); S.active=nb.id; save(true); renderAll(); toast("Duplicated"); return; }
  if(t.id==="bDel"){ if(S.builds.length<=1) return; if(!confirm(`Delete "${b.name}"? This can't be undone.`)) return; S.builds=S.builds.filter(x=>x.id!==b.id); S.active=S.builds[0].id; save(true); renderAll(); toast("Deleted"); return; }
  if(t.id==="bExport"){ download(safeName(b.name)+".chromedeck.json", {chromedeck:1, build:b}); return; }
  if(t.id==="bExportAll"){ download("chromedeck-backup.json", {chromedeck:1, state:S}); return; }
  if(t.id==="bImport"){ $("#bFile").click(); return; }
  if(t.id==="dExport"){ download("chromedeck-data.json", DATA); return; }
  if(t.id==="dImport"){ $("#dFile").click(); return; }
  if(t.id==="dReset"){ if(!confirm("Discard your data edits and go back to the built-in 2.31 seed?")) return; S.dataOverride=null; DATA=clone(SEED); save(true); renderAll(); toast("Seed data restored"); return; }
  if(t.id==="dApply"){ let d; try{ d=JSON.parse($("#dRaw").value); }catch(err){ $("#dMsg").innerHTML=`<div class="warnbox">JSON error: ${esc(err.message)}</div>`; return; } const err=validateData(d); if(err){ $("#dMsg").innerHTML=`<div class="warnbox">${esc(err)}</div>`; return; } DATA=d; S.dataOverride=d; normalize(); save(true); renderAll(); toast("Data applied"); return; }
  if(t.id==="dReload"){ $("#dRaw").value=JSON.stringify(DATA,null,1); $("#dMsg").innerHTML=""; return; }
});
function showTab(id){ $$("nav.tabs button").forEach(x=>x.classList.toggle("on",x.dataset.tab===id)); $$(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+id)); window.scrollTo(0,0); }
function safeName(s){ return s.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-").toLowerCase()||"build"; }

document.addEventListener("input", e=>{
  const t=e.target; const b=build();
  if(t.id==="pq"){ pick.q=t.value; renderPicker(); const i=$("#pq"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); return; }
  if(t.dataset.f==="level"){ b.level=+t.value; $("#lvlN").textContent=b.level; b.updated=Date.now(); renderHeader(); return; }
  if(t.dataset.f==="ccBonus"){ b.ccBonus=Math.max(0,parseInt(t.value)||0); b.updated=Date.now(); renderHeader(); return; }
  if(t.dataset.f==="name"){ b.name=t.value; b.updated=Date.now(); renderHeader(); return; }
  if(t.dataset.f==="notes"){ b.notes=t.value; b.updated=Date.now(); return; }
});
document.addEventListener("change", e=>{
  const t=e.target; const b=build();
  if(t.dataset.f==="level"||t.dataset.f==="ccBonus"){ save(true); renderCapacity(); renderPerks(); return; }
  if(t.dataset.f==="bonusPerk"){ b.bonusPerk=Math.max(0,parseInt(t.value)||0); b.updated=Date.now(); save(true); renderPerks(); return; }
  if(t.dataset.f==="name"||t.dataset.f==="notes"){ save(true); renderBuilds(); return; }
  if(t.id==="buildSel"){ S.active=t.value; save(true); renderAll(); return; }
  if(t.id==="bFile"){ readFile(t, obj=>{
      if(obj.chromedeck && obj.build){ const nb=obj.build; nb.id=uid(); S.builds.push(nb); S.active=nb.id; normalize(); save(true); renderAll(); toast("Build imported"); }
      else if(obj.chromedeck && obj.state){ if(!confirm("Replace all builds, shard progress and data edits with this backup?")) return; store.set(obj.state); loadState(); renderAll(); toast("Backup restored"); }
      else toast("Not a Chromedeck file"); }); return; }
  if(t.id==="dFile"){ readFile(t, d=>{ const err=validateData(d); if(err){ toast(err); return; } DATA=d; S.dataOverride=d; normalize(); save(true); renderAll(); toast("Data imported"); }); return; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); if((e.key==="Enter"||e.key===" ") && e.target.dataset && e.target.dataset.perk){ e.preventDefault(); openPerk(e.target.dataset.perk); } });

loadState(); renderAll();
</script>
</body>
</html>
